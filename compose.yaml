services:
  frontend:
    build: ./Frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./Frontend/src:/app/src
      - ./Frontend/index.html:/app/index.html
      - ./Frontend/vite.config.ts:/app/vite.config.ts
      - ./Frontend/tsconfig.json:/app/tsconfig.json
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./Backend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./Backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/url-shortner
      APP_URL: http://localhost:3000/
    volumes:
      - ./Backend/src:/app/src
      - ./Backend/app.ts:/app/app.ts
      - ./Backend/tsconfig.json:/app/tsconfig.json
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand('ping').ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongodb_data:
